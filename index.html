<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <meta name="format-detection" content="telephone=no">
  <title>かんたん効果音リモコン</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101820; color: #f5f7fa; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body { max-width: 760px; margin: 0 auto; padding: 18px 14px calc(90px + env(safe-area-inset-bottom)); }
    h1 { margin: 0 0 6px; font-size: 26px; }
    p { color: #bac6d2; }
    button, select, input { min-height: 48px; border: 0; border-radius: 10px; font: inherit; }
    button { padding: 10px 15px; background: #293947; color: white; font-weight: 700; touch-action: manipulation; -webkit-appearance: none; appearance: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    button:disabled { opacity: .45; }
    input { display: block; width: 100%; margin-top: 6px; padding: 10px 12px; border: 1px solid #557080; background: #0d141a; color: white; font-size: 16px; }
    input:focus { outline: 3px solid #42c6cc; }
    .top { position: sticky; top: 0; z-index: 2; margin: -18px -14px 14px; padding: 14px; background: #101820f2; border-bottom: 1px solid #31404d; }
    .status { margin: 8px 0; color: #8de0bb; font-weight: 700; }
    .help { margin: 8px 0 0; font-size: 13px; line-height: 1.55; }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; margin: 10px 0; padding: 12px; border: 1px solid #31404d; border-radius: 12px; background: #19242e; }
    .row h2 { margin: 0 0 4px; font-size: 17px; }
    .key { color: #ffd37b; font-size: 14px; }
    .sound-picker { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 6px; }
    .sound-picker label { grid-column: 1 / -1; color: #bac6d2; font-size: 13px; }
    .sound-picker select { width: 100%; min-width: 0; padding: 0 8px; border: 1px solid #557080; background: #0d141a; color: #f5f7fa; font-size: 16px; }
    .sound-picker .open-file { padding-inline: 10px; font-size: 14px; }
    .sound-picker input[hidden] { display: none; }
    .actions { display: flex; gap: 6px; }
    .learn { background: #176d73; }
    .play { min-width: 84px; background: #27845b; }
    #stop { position: fixed; z-index: 3; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); background: #a33e45; box-shadow: 0 4px 18px #0008; }
    #stop:disabled { display: none; }
    @media (max-width: 430px) { .row { grid-template-columns: 1fr; } .actions button { flex: 1; } }
  </style>
</head>
<body>
  <header class="top">
    <h1>効果音リモコン</h1>
    <button id="prepare" type="button">音を準備する</button>
    <button id="stop" type="button" disabled>全停止</button>
    <div id="status" class="status" role="status" aria-live="polite">最初に「音を準備する」を押してください</div>
    <p id="last" class="help">最後の入力：なし</p>
    <label for="capture" class="help">リモコン入力（キー登録後、ここにフォーカスがある状態で押します）</label>
    <input id="capture" type="text" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="リモコン入力テスト">
    <p class="help">「キー登録」→リモコンのボタンを押します。音量ボタンはiPhoneが処理するため登録できません。本番中は「設定 → 画面表示と明るさ → 自動ロック → なし」にしてください（画面が消えるとリモコンが効きません）。</p>
  </header>
  <main id="list" aria-label="効果音"></main>

        file, { name, url: `./sound-effects/${encodeURIComponent(file)}`, bufferPromise: null }
      ]));
      try {
        const embedded = JSON.parse(document.querySelector("#embedded-sounds").textContent);
        for (const [file, data] of Object.entries(embedded)) if (library.has(file)) library.get(file).data = data;
      } catch (_) {}
      function base64ToBuffer(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes.buffer;
      }
      const effects = builtIns.map(([name, file]) => ({
        name, key: "", file, sound: library.get(file), source: null, requestId: 0, selectionId: 0
      }));
      const sourceStorageKey = "magic-show-cue.effect-remote-simple.sources.v1";
      const storageKey = "magic-show-cue.effect-remote-simple.v1";
      const list = document.querySelector("#list");
      const status = document.querySelector("#status");
      const last = document.querySelector("#last");
      const capture = document.querySelector("#capture");
      const stopButton = document.querySelector("#stop");
      let learning = -1;
      let learningTimer;
      let audioContext;
      let keepAlive = null;
      let keepAliveWanted = false;
      let audioWasStopped = false;

      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
        effects.forEach((effect, i) => { effect.key = typeof saved[i] === "string" ? canonicalKey(saved[i]) : ""; });
      } catch (_) {}

      try {
        const saved = JSON.parse(localStorage.getItem(sourceStorageKey) || "[]");
        effects.forEach((effect, i) => {
          if (!library.has(saved?.[i])) return;
          effect.file = saved[i];
          effect.sound = library.get(effect.file);
        });
      } catch (_) {}

      function saveSources() {
        try { localStorage.setItem(sourceStorageKey, JSON.stringify(effects.map((effect) => effect.file))); }
        catch (_) {}
      }
      function save() {
        try { localStorage.setItem(storageKey, JSON.stringify(effects.map((effect) => effect.key))); }
        catch (_) {}
      }
      function render() {
        list.innerHTML = effects.map((effect, i) => `
          <section class="row" data-index="${i}">
            <div><h2>${effect.name}</h2><div class="key"></div></div>
            <div class="actions">
              <button class="learn" type="button">${learning === i ? "入力待ち…" : "キー登録"}</button>
              <button class="play" type="button">再生</button>
            </div>
            <div class="sound-picker">
              <label for="sound-${i}">音源を選ぶ</label>
              <select id="sound-${i}" class="sound-select" aria-label="${effect.name}の音源"></select>
              <button class="open-file" type="button" aria-label="${effect.name}の音声ファイルを選ぶ">ファイル…</button>
              <input class="sound-file" type="file" accept=".wav,.mp3,audio/wav,audio/x-wav,audio/wave,audio/mpeg,audio/mp3" hidden>
            </div>
          </section>`).join("");
        list.querySelectorAll(".key").forEach((label, i) => {
          label.textContent = `キー：${effects[i].key || "未設定"}`;
        });
        list.querySelectorAll(".sound-select").forEach((select, i) => {
          const effect = effects[i];
          for (const [file, sound] of library) select.add(new Option(sound.name, file));
          if (effect.sound.file) select.add(new Option(effect.sound.name, "custom"));
          select.value = effect.sound.file ? "custom" : effect.file;
        });
      }
      function canonicalKey(name) {
        if (/^(PageUp|Prior)$/i.test(name)) return "PageUp";
        if (/^(PageDown|Next)$/i.test(name)) return "PageDown";
        return name;
      }
      function keyName(event) {
        const key = event.key || "";
        const code = event.code || "";
        if (/^(Key[A-Z]|Digit[0-9]|Numpad\w+)$/i.test(code)) return code;
        if (key === " " || key === "Spacebar") return "Space";
        if (key && key !== "Unidentified") return canonicalKey(key);
        if (code && code !== "Unidentified") return canonicalKey(code);
        const legacyCode = event.keyCode || event.which;
        if (legacyCode === 33) return "PageUp";
        if (legacyCode === 34) return "PageDown";
        return "不明";
      }
      function showInput(name) {
        last.textContent = `最後の入力：${name}（${new Date().toLocaleTimeString("ja-JP")}）`;
      }
      function focusCapture() {
        try { capture.focus({ preventScroll: true }); }
        catch (_) { capture.focus(); }
      }
      function getAudioContext() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) throw new Error("このブラウザでは効果音を再生できません");
        if (!audioContext) {
          audioContext = new AudioContextClass();
          // iPhoneは電話・Siri・画面ロックなどで音が止まる(interrupted)ので、状態を監視する
          audioContext.onstatechange = () => {
            if (audioContext.state === "running") {
              if (audioWasStopped) {
                audioWasStopped = false;
                status.textContent = "音が復帰しました";
              }
            } else {
              audioWasStopped = true;
              status.textContent = "音が一時停止しています。画面をタップすると再開します";
            }
          };
        }
        return audioContext;
      }
      // iPhoneのマナーモード(消音スイッチ)でも鳴らし、リモコンのメディアキーを受け取れるようにする
      function makeSilentWavUrl() {
        const sampleRate = 8000;
        const samples = sampleRate;
        const buffer = new ArrayBuffer(44 + samples * 2);
        const view = new DataView(buffer);
        const text = (offset, value) => { for (let i = 0; i < value.length; i++) view.setUint8(offset + i, value.charCodeAt(i)); };
        text(0, "RIFF"); view.setUint32(4, 36 + samples * 2, true); text(8, "WAVE"); text(12, "fmt ");
        view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true); view.setUint16(34, 16, true);
        text(36, "data"); view.setUint32(40, samples * 2, true);
        return URL.createObjectURL(new Blob([buffer], { type: "audio/wav" }));
      }
      function startKeepAlive() {
        try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (_) {}
        try {
          if (!keepAlive) {
            keepAlive = new Audio();
            keepAlive.src = makeSilentWavUrl();
            keepAlive.loop = true;
            keepAlive.setAttribute("playsinline", "");
            keepAlive.addEventListener("pause", () => {
              if (keepAliveWanted && !document.hidden) keepAlive.play().catch(() => {});
            });
          }
          keepAliveWanted = true;
          if (keepAlive.paused) keepAlive.play().catch(() => {});
        } catch (_) {}
      }
      function tryResume() {
        if (audioContext && audioContext.state !== "running") audioContext.resume().catch(() => {});
        if (keepAliveWanted && keepAlive && keepAlive.paused) keepAlive.play().catch(() => {});
      }
      async function enableAudio() {
        const context = getAudioContext();
        if (context.state !== "running") {
          // iPhoneではresume()が応答しないことがあるので、待ちすぎない
          await Promise.race([
            context.resume().catch(() => {}),
            new Promise((resolve) => setTimeout(resolve, 1500))
          ]);
        }
        if (context.state !== "running") throw new Error("音が停止しています。画面の「音を準備する」をタップしてください");
        return context;
      }
      // 古いiOS(promise版decodeAudioData非対応)でも動くようにする
      function decode(context, data) {
        return new Promise((resolve, reject) => {
          const result = context.decodeAudioData(data, resolve, reject);
          if (result && typeof result.then === "function") result.then(resolve, reject);
        });
      }
      function loadEffect(sound, context) {
        if (!sound.bufferPromise) {
          sound.bufferPromise = (async () => {
            if (sound.file) return decode(context, await sound.file.arrayBuffer());
            if (sound.data) return decode(context, base64ToBuffer(sound.data));
            const response = await fetch(sound.url);
            if (!response.ok) throw new Error(`${sound.name}を読み込めません`);
            return decode(context, await response.arrayBuffer());
          })().catch((error) => {
            sound.bufferPromise = null;
            throw error;
          });
        }
        return sound.bufferPromise;
      }
      async function prepare() {
        startKeepAlive();
        try {
          const context = await enableAudio();
          const results = await Promise.allSettled(effects.map((effect) => loadEffect(effect.sound, context)));
          const failed = effects.filter((_, i) => results[i].status === "rejected").map((effect) => effect.sound.name);
          if (navigator.mediaSession) {
            try {
              if (window.MediaMetadata) navigator.mediaSession.metadata = new MediaMetadata({ title: "効果音リモコン", artist: "Magic Show Cue" });
              navigator.mediaSession.playbackState = "playing";
            } catch (_) {}
          }
          status.textContent = failed.length
            ? `準備完了（読み込めない音：${failed.join("、")}。音源を選び直してください）`
            : "準備完了。再生ボタンかリモコンを押してください";
          focusCapture();
        } catch (error) {
          status.textContent = error.message || "音を準備できませんでした";
        }
      }
      function stopEffect(effect) {
        effect.requestId += 1;
        const source = effect.source;
        effect.source = null;
        if (source) source.stop();
      }
      function updateStopButton() {
        stopButton.disabled = effects.every((effect) => !effect.source);
      }
      async function play(index) {
        const effect = effects[index];
        stopEffect(effect);
        const requestId = effect.requestId;
        const sound = effect.sound;
        stopButton.disabled = false;
        try {
          const context = await enableAudio();
          const buffer = await loadEffect(sound, context);
          if (effect.requestId !== requestId) return;
          const source = context.createBufferSource();
          source.buffer = buffer;
          source.connect(context.destination);
          source.onended = () => {
            source.disconnect();
            if (effect.source !== source) return;
            effect.source = null;
            updateStopButton();
          };
          source.start();
          effect.source = source;
          status.textContent = `再生中：${sound.name}`;
        } catch (_) {
          if (effect.requestId !== requestId) return;
          updateStopButton();
          status.textContent = "再生できません。画面の「音を準備する」を押してください";
        }
      }
      function stopAll() {
        effects.forEach(stopEffect);
        updateStopButton();
        status.textContent = "停止しました";
      }
      function receiveKey(name, repeat = false) {
        showInput(name);
        if (learning >= 0) {
          if (["Shift", "Control", "Alt", "Meta"].includes(name)) return;
          if (!name || name === "不明" || name === "Unidentified") {
            status.textContent = "ボタン名を取得できません。キーボード入力を送るリモコンをお使いください";
            return;
          }
          clearTimeout(learningTimer);
          effects.forEach((effect, i) => {
            if (i !== learning && effect.key.toLowerCase() === name.toLowerCase()) effect.key = "";
          });
          effects[learning].key = name;
          learning = -1;
          save();
          render();
          status.textContent = `${effects.find((effect) => effect.key === name).name} に「${name}」を登録しました`;
          focusCapture();
          return;
        }
        const index = effects.findIndex((effect) => effect.key && effect.key.toLowerCase() === name.toLowerCase());
        if (index >= 0 && !repeat) play(index);
      }
      async function chooseFile(effect, file) {
        const selectionId = ++effect.selectionId;
        if (!/\.(wav|mp3)$/i.test(file.name) && !/^audio\/(wav|x-wav|wave|mpeg|mp3)$/i.test(file.type)) {
          status.textContent = "WAVかMP3のファイルを選んでください";
          return;
        }
        const sound = { name: file.name, file, bufferPromise: null };
        status.textContent = `${file.name}を読み込んでいます`;
        try {
          await loadEffect(sound, getAudioContext());
          if (effect.selectionId !== selectionId) return;
          stopEffect(effect);
          effect.sound = sound;
          updateStopButton();
          render();
          status.textContent = `音源：${sound.name}`;
        } catch (_) {
          if (effect.selectionId !== selectionId) return;
          status.textContent = `${file.name}を読み込めませんでした。音源を確認してください`;
        }
      }

      list.addEventListener("change", (event) => {
        const control = event.target;
        const row = control.closest("[data-index]");
        if (!row) return;
        const effect = effects[Number(row.dataset.index)];
        if (control.classList.contains("sound-select")) {
          const sound = library.get(control.value);
          if (!sound) return;
          effect.selectionId += 1;
          stopEffect(effect);
          effect.file = control.value;
          effect.sound = sound;
          control.querySelector('option[value="custom"]')?.remove();
          saveSources();
          updateStopButton();
          status.textContent = `音源：${sound.name}`;
          focusCapture();
        } else if (control.classList.contains("sound-file")) {
          const file = control.files[0];
          control.value = "";
          if (file) chooseFile(effect, file);
        }
      });
      list.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        const row = button.closest("[data-index]");
        const index = Number(row.dataset.index);
        if (button.classList.contains("open-file")) {
          row.querySelector(".sound-file").click();
          return;
        }
        if (button.classList.contains("play")) play(index);
        if (button.classList.contains("learn")) {
          learning = index;
          render();
          status.textContent = `${effects[index].name} の登録待ちです。リモコンボタンを押してください`;
          focusCapture();
          clearTimeout(learningTimer);
          learningTimer = setTimeout(() => {
            if (learning !== index) return;
            learning = -1;
            render();
            status.textContent = "入力を受信できませんでした。リモコンをiPhoneに接続し、キーボード入力を送る機種か確認してください";
          }, 10000);
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.target instanceof Element && event.target.closest(".sound-select, .sound-file")) return;
        const name = keyName(event);
        if (learning >= 0) {
          event.preventDefault();
          receiveKey(name, event.repeat);
          return;
        }
        const assigned = effects.some((effect) => effect.key && effect.key.toLowerCase() === name.toLowerCase());
        if (assigned) event.preventDefault();
        receiveKey(name, event.repeat);
      }, true);
      capture.addEventListener("input", () => { capture.value = ""; });
      document.querySelector("#prepare").addEventListener("click", prepare);
      stopButton.addEventListener("click", stopAll);
      render();
      if (navigator.mediaSession && navigator.mediaSession.setActionHandler) {
        const mediaKeys = { play: "MediaPlayPause", pause: "MediaPlayPause", nexttrack: "MediaTrackNext", previoustrack: "MediaTrackPrevious" };
        for (const [action, name] of Object.entries(mediaKeys)) {
          try { navigator.mediaSession.setActionHandler(action, () => {
            tryResume();
            receiveKey(name);
          }); } catch (_) {}
        }
      }
      // 画面タップ・キー入力・アプリ復帰のたびに、止まっている音を再開する
      ["touchend", "click", "keydown"].forEach((type) => document.addEventListener(type, tryResume, { capture: true, passive: true }));
      document.addEventListener("visibilitychange", () => { if (!document.hidden) tryResume(); });
    })();
  </script>
</body>
</html>
